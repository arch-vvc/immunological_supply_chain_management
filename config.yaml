dataset:
  path: data/raw/arcos_sampled_50k.csv
  separator: ','
  encoding: utf-8
columns:
  date: TRANSACTION_DATE
  manufacturer: Revised_Company_Name
  distributor: REPORTER_NAME
  retailer: BUYER_NAME
  retailer_state: BUYER_STATE
  quantity: QUANTITY
settings:
  retailer_combine: null
  # Synthetic ARCOS only: move the generated 2006-2014 calendar onto the macro
  # indicators' calendar so per-week stress thresholds apply (see preprocess.py).
  # Set to null for any real dataset.
  calendar_offset_years: 12
thresholds:
  volume_zscore: 3.0
  frequency_zscore: 2.5
  temporal_surge_zscore: 2.5
  concentration_pct: 0.9
