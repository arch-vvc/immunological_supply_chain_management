# ══════════════════════════════════════════════════════════════════════
# Domain Config — US Pharmaceutical Supply Chain
# ══════════════════════════════════════════════════════════════════════
# Drop in a different YAML to run the same pipeline on any industry.
# Only this file and your data need to change — zero code edits.

domain:
  name: "US Pharmaceutical Supply Chain"
  industry: pharma
  node_roles:
    tier1: manufacturer     # upstream drug manufacturers
    tier2: distributor      # wholesale distributors (McKesson, AmerisourceBergen)
    tier3: retailer         # pharmacies / hospitals

anomaly:
  z_score_threshold: 2.5   # standard clinical threshold
  rolling_window: 50        # rows to maintain rolling stats
  quantity_lognormal_mean: 5.5
  quantity_lognormal_sigma: 1.2
  quantity_max: 50000

cytokine_storm:
  threshold: 3              # disruptions in window to trigger cascade alert
  window_seconds: 60

routing:
  ppo_candidates: 10        # candidate pool fed to PPO agent
  feature_dims: 5           # features per candidate (risk, gnn, in_deg, out_deg, has_path)
  risk_weight: 0.5          # composite scoring weights (must sum to 1.0)
  gnn_weight: 0.3
  path_weight: 0.2
  decay_window_minutes: 30  # confidence decay: rolling window for overuse detection
  decay_per_use: 0.15       # confidence drop per re-use in window
  decay_floor: 0.5          # minimum confidence multiplier
  memory_top_k: 3           # FAISS neighbours to retrieve

shipping_costs:
