[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "immunological-supply-chain"
version = "1.0.0"
description = "Self-healing supply chains with AI digital antibodies — PES University capstone PW26_RGP_01"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# src/ is a flat directory of stage modules (no package). Installing in
# editable mode (pip install -e .) makes each one importable from anywhere —
# the dashboard, tests/ and extras/ — without sys.path manipulation.
# tests/test_runner.py fails if a new src/ module is missing from this list.
# Only IMPORT-SAFE modules are exposed: libraries, and stages whose work is
# behind `if __name__ == "__main__"`. Most stage scripts run their whole
# pipeline at module scope (importing them would re-run the stage and rewrite
# outputs), so they are deliberately NOT listed — run them via main.py.
# tests/test_runner.py enforces this property for every module listed here.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "ai_agent",
    "arcos_adapter",
    "auto_onboard",
    "dataco_adapter",
    "domain_config",
    "gnn_encoder",
    "gnn_explainer",
    "immune_response_engine",
    "ir_pipeline",
    "ir_schema",
    "ir_stages",
    "isc_common",
    "macro_event_validation",
    "project_metrics",
    "results_manifest",
    "scms_adapter",
    "scms_event_harness",
    "scms_vendor_scorecard",
    "stream_consumer",
    "stream_simulator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
